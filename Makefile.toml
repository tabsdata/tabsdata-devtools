# cargo-make tasks for tabsdata-devtools. `cargo make help` lists them all.
#
#   cargo make install -- --editable     every env editable from this checkout (= dev)
#   cargo make install -- --dir /tmp/t2  wheels -> <dir>/wheels, then tdd-install
#   cargo make setup                     install, then every command's config file
#   cargo make check                     lint + test + reqs
#   cargo make uninstall                 remove the tdd dir
#
# Note the `--`: cargo-make forwards arguments after it to the task.
#
# Every task is duckscript, cargo-make's own language, so one script runs on
# macOS, Linux and Windows alike: they orchestrate -- read a variable, prepare
# arguments, call uv or Python -- and anything with an algorithm of its own is
# a file in make/. cargo-make expands `${NAME}` from the environment before a
# script runs, so a script's own variables are lowercase: no environment
# variable can stand in for one. What a task does and why is said above it, so
# its script is code alone.

[config]
default_to_workspace = false
skip_core_tasks = true

# XP_TOOL is the XP tree xp carries: at the root, where it is read and edited,
# and force-included into the tool's wheel. MAKE_SCRIPTS holds the tasks' own
# files: help.txt, requirements.txt, catalog_rows.py.
[env]
WHEELS_OUT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/wheels"
PACKAGES = "${CARGO_MAKE_WORKING_DIRECTORY}/packages"
XP_TOOL = "${CARGO_MAKE_WORKING_DIRECTORY}/xp-tool"
TDD_PKG = "${CARGO_MAKE_WORKING_DIRECTORY}/packages/tabsdata-dev-tdd"
MAKE_SCRIPTS = "${CARGO_MAKE_WORKING_DIRECTORY}/make"

# --------------------------------------------------------------------- the tasks' env

# Every task that runs Python runs it from its own env, <tdd dir>/tdd-venvs/make,
# built on exactly the repo's PYTHON, uv-managed only -- `uv venv` never takes
# an active venv, conda env or ./.venv for its interpreter, which `uv run`
# does -- with make/requirements.txt (ruff, pytest). It is rebuilt when either
# file changes: the env keeps a copy of both, read as any checkout has them (a
# Windows one may hold CRLF line ends), so the check is three small files read
# and compared, nothing asked of uv. Built relocatable and copied from the
# cache, as every env in a tdd dir is. tdd itself is not installed there: it is
# the standard library only, so a task puts this checkout's tdd on PYTHONPATH
# -- an env shared by several checkouts must not hold any one of them.
#
# Sets, for the tasks after it: MAKE_TDD_DIR ($TDD_DIR, else ~/.tdd), MAKE_PY
# (that env's python), and MAKE_VENV_BIN / MAKE_EXE, how any venv lays out its
# programs here (bin and nothing; Scripts and .exe on Windows).
[tasks.make-env]
private = true
script_runner = "@duckscript"
script = [
    '''
    tdd_dir = get_env TDD_DIR
    if is_empty ${tdd_dir}
        home = get_home_dir
        tdd_dir = set "${home}/.tdd"
    end
    family = os_family
    if eq ${family} windows
        venv_bin = set Scripts
        exe = set .exe
    else
        venv_bin = set bin
        exe = set ""
    end
    venv = set "${tdd_dir}/tdd-venvs/make"
    py = set "${venv}/${venv_bin}/python${exe}"
    built_from = set "${venv}/built-from"

    version = readfile "${CARGO_MAKE_WORKING_DIRECTORY}/PYTHON"
    version = trim ${version}
    reqs = readfile "${MAKE_SCRIPTS}/requirements.txt"
    wanted = concat ${version} "\n" ${reqs}
    wanted = replace ${wanted} "\r" ""
    wanted = trim_end ${wanted}

    current = set ""
    if is_path_exists ${built_from}
        current = readfile ${built_from}
    end
    fresh = is_path_exists ${py}
    if ${fresh}
        fresh = eq ${current} ${wanted}
    end
    if not ${fresh}
        echo "building the cargo-make tasks' env ${venv} (python ${version})"
        set_env UV_LINK_MODE copy
        exec --fail-on-error uv venv --quiet --clear --relocatable --managed-python --python ${version} ${venv}
        exec --fail-on-error uv pip install --quiet --python ${venv} -r "${MAKE_SCRIPTS}/requirements.txt"
        writefile ${built_from} ${wanted}
    end
    set_env MAKE_TDD_DIR ${tdd_dir}
    set_env MAKE_PY ${py}
    set_env MAKE_VENV_BIN ${venv_bin}
    set_env MAKE_EXE ${exe}
    ''']

# --------------------------------------------------------------------- default

[tasks.default]
description = "Same as help"
run_task = "help"

[tasks.help]
description = "List every task with its options"
script_runner = "@duckscript"
script = [
    '''
    text = readfile "${MAKE_SCRIPTS}/help.txt"
    echo ${text}
    ''']

# --------------------------------------------------------------------- dev loop

[tasks.dev]
description = "Shortcut for `install -- --editable`"
env = { "MAKE_EDITABLE" = "1" }
run_task = "install"

# --------------------------------------------------------------------- quality

[tasks.fmt]
description = "Format every package with the pinned ruff"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    py = get_env MAKE_PY
    exec --fail-on-error ${py} -m ruff format ${PACKAGES} ${MAKE_SCRIPTS}
    ''']

[tasks.lint]
description = "Lint every package with the pinned ruff"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    py = get_env MAKE_PY
    exec --fail-on-error ${py} -m ruff check ${PACKAGES} ${MAKE_SCRIPTS}
    ''']

# --------------------------------------------------------------------- tests

# tdd is the standard library only: this checkout's, on PYTHONPATH, is all it needs.
[tasks.test-tdd]
description = "Test the dispatcher (no toolset: it declares no dependencies)"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    echo "== tabsdata-dev-tdd"
    py = get_env MAKE_PY
    set_env PYTHONPATH "${TDD_PKG}/src/python/main"
    exec --fail-on-error ${py} -m pytest "${TDD_PKG}/src/python/test" -q
    ''']

# Each tool is exercised against the exact pins it ships with: its tests run
# under its own toolset's interpreter. The catalog says which toolset that is;
# it is read here rather than through a tdd word because testing is a build
# concern, not something a user does from a finished install.
#
# A common-* is tested once per toolset env it is a member of -- that is its
# real compatibility matrix (common-core: every toolset; a family library: the
# toolsets whose tools use it). Membership comes from the catalog, not from
# globbing tdd-venvs/: that directory also holds the tdd, shells and make envs.
#
# The shell package is tested in its own env, where its script data is
# installed; pytest is added to it first, the one thing a test run needs there.
[tasks.test-toolsets]
description = "Test every tool and common package inside its own toolset venv"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    tdd_dir = get_env MAKE_TDD_DIR
    venv_bin = get_env MAKE_VENV_BIN
    exe = get_env MAKE_EXE
    catalog = set "${tdd_dir}/catalog.json"
    if not is_path_exists ${catalog}
        assert_fail "no initialized tdd dir at ${tdd_dir} -- run 'cargo make dev' first"
    end
    venvs = set "${tdd_dir}/tdd-venvs"
    tdd_py = set "${venvs}/tdd/${venv_bin}/python${exe}"

    rows = exec --fail-on-error ${tdd_py} "${MAKE_SCRIPTS}/catalog_rows.py" tools ${catalog}
    lines = split ${rows.stdout} "\n"
    for line in ${lines}
        line = trim ${line}
        if not is_empty ${line}
            words = split ${line} " "
            toolset = array_get ${words} 1
            package = array_get ${words} 2
            echo "== ${package}"
            exec --fail-on-error "${venvs}/${toolset}/${venv_bin}/python${exe}" -m pytest "${PACKAGES}/${package}/src/python/test" -q
        end
    end

    rows = exec --fail-on-error ${tdd_py} "${MAKE_SCRIPTS}/catalog_rows.py" commons ${catalog}
    lines = split ${rows.stdout} "\n"
    for line in ${lines}
        line = trim ${line}
        if not is_empty ${line}
            words = split ${line} " "
            name = array_get ${words} 0
            toolset = array_get ${words} 1
            echo "== ${name}  [${toolset}]"
            exec --fail-on-error "${venvs}/${toolset}/${venv_bin}/python${exe}" -m pytest "${PACKAGES}/${name}/src/python/test" -q
        end
    end

    echo "== tabsdata-dev-shell"
    exec --fail-on-error uv pip install --quiet --python "${venvs}/shells" pytest
    exec --fail-on-error "${venvs}/shells/${venv_bin}/python${exe}" -m pytest "${PACKAGES}/tabsdata-dev-shell/src/python/test" -q
    ''']

[tasks.test]
description = "Run every test"
dependencies = ["test-tdd", "test-toolsets"]

[tasks.reqs]
description = "Report external binary requirements for every tool"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    tdd_dir = get_env MAKE_TDD_DIR
    venv_bin = get_env MAKE_VENV_BIN
    exe = get_env MAKE_EXE
    exec --fail-on-error "${tdd_dir}/tdd-venvs/tdd/${venv_bin}/tdd-exe${exe}" --reqs
    ''']

[tasks.check]
description = "Lint then test -- what CI runs"
dependencies = ["lint", "test", "reqs"]

# --------------------------------------------------------------------- wheels

# Runs the generator from this checkout, on the tasks' env, so this works before
# `cargo make dev` -- and so the catalog baked into the wheels is never stale.
# It is a module, not a tdd word: nobody regenerates a catalog from a finished
# install.
[tasks.gen]
description = "Regenerate the toolset packages and the shipped catalog"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    py = get_env MAKE_PY
    set_env PYTHONPATH "${TDD_PKG}/src/python/main"
    exec --fail-on-error ${py} -m tabsdata_dev.tdd.generate
    ''']

# One pass over every toolset, so a range shared through a common-* resolves to
# the same version everywhere. Drift between locks is a timing artifact -- one
# toolset locked months after another -- and locking them together is the fix
# `cargo make gen` points at when it warns.
#
# Against PyPI only. A lock records its registry's URLs, and a developer's shell
# may point uv at a local mirror or a private index; locked through one, the
# lock works only where it runs. So the shell's index settings are dropped and
# the index named -- the same list and URL as INDEX_ENV / LOCK_INDEX in
# tabsdata_dev/tdd/initialize.py, which syncs against it; test_discover checks both.
[tasks.lock]
description = "Re-resolve every toolset's uv.lock in one pass"
dependencies = ["gen"]
script_runner = "@duckscript"
script = [
    '''
    unset_env UV_INDEX
    unset_env UV_DEFAULT_INDEX
    unset_env UV_INDEX_URL
    unset_env UV_EXTRA_INDEX_URL
    py = get_env MAKE_PY
    toolsets = glob_array "${PACKAGES}/tabsdata-dev-toolset-*"
    for pkg in ${toolsets}
        name = basename ${pkg}
        toolset = replace ${name} "tabsdata-dev-toolset-" ""
        echo "== locking ${toolset}"
        exec --fail-on-error uv lock --quiet --upgrade --project ${pkg} --python ${py} --default-index https://pypi.org/simple
    end
    echo ""
    echo "re-resolved; `cargo make dev` rebuilds the envs from the new locks"
    ''']

# A wheel for every first-party package but the toolset-* ones: generated
# meta-packages with no build backend and no code, whose tool wheels carry the
# same information through their dependencies.
#
# Then one exported lock per toolset. The locks carry the transitive
# THIRD-PARTY closure, pinned and hashed, while the wheels beside them carry
# the first-party code: together they pin an env completely. Every first-party
# package is a local (path) source, so --no-emit-local leaves them all out.
# --frozen exports the committed lock as it is: without it uv re-locks first
# whenever it finds the lock stale -- a shell whose UV_DEFAULT_INDEX spells
# PyPI differently is enough -- and rewrites every uv.lock. --no-header: uv's
# header embeds an absolute path from the build machine, and these locks travel
# to other machines.
#
# tabsdata-dev-shell and tabsdata-dev-tdd declare no dependencies, so their
# locks are deliberately empty rather than absent -- tdd init expects one lock
# per env it builds, and an absent lock is an error worth keeping.
[tasks.wheels]
description = "Build a wheel for every first-party package"
dependencies = ["gen"]
script_runner = "@duckscript"
script = [
    '''
    rm -r ${WHEELS_OUT}
    mkdir ${WHEELS_OUT}
    py = get_env MAKE_PY

    packages = glob_array "${PACKAGES}/tabsdata-dev-*"
    for pkg in ${packages}
        name = basename ${pkg}
        if not starts_with ${name} "tabsdata-dev-toolset-"
            echo "== building ${name}"
            exec --fail-on-error uv build --quiet --wheel ${pkg} --python ${py} --out-dir ${WHEELS_OUT}
        end
    end

    toolsets = glob_array "${PACKAGES}/tabsdata-dev-toolset-*"
    for pkg in ${toolsets}
        name = basename ${pkg}
        toolset = replace ${name} "tabsdata-dev-toolset-" ""
        echo "== exporting lock for toolset ${toolset}"
        exec --fail-on-error uv export --quiet --frozen --project ${pkg} --format requirements-txt --no-emit-project --no-emit-local --no-annotate --no-header -o "${WHEELS_OUT}/${toolset}.lock"
    end

    writefile "${WHEELS_OUT}/shells.lock" "# tabsdata-dev-shell has no third-party dependencies.\n"
    writefile "${WHEELS_OUT}/tdd.lock" "# tabsdata-dev-tdd is standard library only.\n"

    cp "${CARGO_MAKE_WORKING_DIRECTORY}/VERSION" "${WHEELS_OUT}/VERSION"
    version = readfile "${WHEELS_OUT}/VERSION"
    version = trim ${version}
    echo ""
    echo "version ${version}"
    built = glob_array "${WHEELS_OUT}/*"
    for file in ${built}
        name = basename ${file}
        echo ${name}
    end
    ''']

# Arguments: --dir PATH (or --dir=PATH), --editable / -e; the `--` cargo-make
# forwards is skipped. `dev` sets MAKE_EDITABLE instead.
#
# Every first-party wheel keeps its filename across rebuilds -- same VERSION,
# new contents -- and uv caches wheels by filename, so a stale build could be
# served from the cache. Every devtools package is evicted first, so this
# install can only see what it builds. Third-party packages stay cached: their
# wheels are immutable per version.
#
# Editable: nothing is installed globally. tdd-install runs from this checkout
# on the tasks' env and creates the real envs inside the tdd dir, tdd-exe's
# included, every first-party package linked to this checkout. No wheels are
# involved, which is why `wheels` is run from the script rather than declared
# as a dependency.
#
# From wheels: they are built, staged in <dir>/wheels, and tdd-install runs out
# of the tdd wheel just built, not the source tree: a wheels-mode install is
# deliberately non-editable, so its catalog is a frozen snapshot. Nothing lands
# on PATH; the envs go inside the tdd dir. --refresh because uv caches by wheel
# filename and a rebuild keeps the same VERSION.
[tasks.install]
description = "Build a tdd dir: from wheels by default, or editable with --editable"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    tdd_dir = get_env MAKE_TDD_DIR
    editable = get_env MAKE_EDITABLE
    editable = eq ${editable} 1
    count = array_length ${@}
    i = set 0
    while less_than ${i} ${count}
        arg = array_get ${@} ${i}
        i = calc ${i} + 1
        if eq ${arg} "--dir"
            tdd_dir = array_get ${@} ${i}
            i = calc ${i} + 1
        elseif starts_with ${arg} "--dir="
            tdd_dir = replace ${arg} "--dir=" ""
        elseif eq ${arg} "--editable"
            editable = set true
        elseif eq ${arg} "-e"
            editable = set true
        elseif not eq ${arg} "--"
            assert_fail "cargo make install: unexpected argument ${arg}"
        end
    end

    packages = glob_array "${PACKAGES}/tabsdata-dev-*"
    for pkg in ${packages}
        name = basename ${pkg}
        exec --fail-on-error uv cache clean --quiet ${name}
    end
    echo "evicted devtools packages from the uv cache"

    py = get_env MAKE_PY
    if ${editable}
        set_env PYTHONPATH "${TDD_PKG}/src/python/main"
        exec --fail-on-error ${py} -m tabsdata_dev.tdd.install --dir ${tdd_dir}
        exit 0
    end

    exec --fail-on-error cargo make wheels

    staged = set "${tdd_dir}/wheels"
    mkdir ${staged}
    old = glob_array "${staged}/*"
    for file in ${old}
        rm ${file}
    end
    wheels = glob_array "${WHEELS_OUT}/*.whl"
    locks = glob_array "${WHEELS_OUT}/*.lock"
    for file in ${wheels}
        name = basename ${file}
        cp ${file} "${staged}/${name}"
    end
    for file in ${locks}
        name = basename ${file}
        cp ${file} "${staged}/${name}"
    end
    cp "${WHEELS_OUT}/VERSION" "${staged}/VERSION"
    n_wheels = array_length ${wheels}
    n_locks = array_length ${locks}
    echo "staged ${n_wheels} wheels and ${n_locks} locks in ${staged}"

    tdd_wheels = glob_array "${WHEELS_OUT}/tabsdata_dev_tdd-*.whl"
    tdd_wheel = array_get ${tdd_wheels} 0
    exec --fail-on-error uvx --quiet --refresh --python ${py} --from ${tdd_wheel} tdd-install --dir ${tdd_dir} --from-wheels
    ''']

# Arguments: --dir PATH (or --dir=PATH), --editable / -e, --force / -f,
# --no-config; the `--` cargo-make forwards is skipped.
#
# A fresh tdd dir in one step: `install` (editable or from wheels), then the
# config file of every command that owns options, so they are there to read and
# edit instead of asked for one at a time. Safe to re-run, which is how a new
# command gets its file: an existing one is kept unless --force, which
# recreates it keeping what it set. The task decides what to keep, so a create
# always passes --force -- a plain create where there is no file yet.
#
# The config action belongs to each command: a tool's is reached through
# tdd-exe, a shell command's only through a loader, so it runs in a shell of
# the family the OS always has -- bash, or pwsh on Windows. bash, not sh: the
# loader defines tdd-exe and tdd-fn, names a POSIX-mode shell refuses (macOS's
# /bin/sh is one). TDD_DIR is set for both: tdd-exe finds its tdd dir there, not
# where it is installed. A launcher is skipped: every argument is the
# program's, `config` included.
[tasks.setup]
description = "Build a tdd dir with install, then give every command its config file"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    tdd_dir = get_env MAKE_TDD_DIR
    editable = set false
    force = set false
    configs = set true
    count = array_length ${@}
    i = set 0
    while less_than ${i} ${count}
        arg = array_get ${@} ${i}
        i = calc ${i} + 1
        if eq ${arg} "--dir"
            tdd_dir = array_get ${@} ${i}
            i = calc ${i} + 1
        elseif starts_with ${arg} "--dir="
            tdd_dir = replace ${arg} "--dir=" ""
        elseif eq ${arg} "--editable"
            editable = set true
        elseif eq ${arg} "-e"
            editable = set true
        elseif eq ${arg} "--force"
            force = set true
        elseif eq ${arg} "-f"
            force = set true
        elseif eq ${arg} "--no-config"
            configs = set false
        elseif not eq ${arg} "--"
            assert_fail "cargo make setup: unexpected argument ${arg}"
        end
    end

    if ${editable}
        exec --fail-on-error cargo make install -- --dir ${tdd_dir} --editable
    else
        exec --fail-on-error cargo make install -- --dir ${tdd_dir}
    end
    if not ${configs}
        echo "installed ${tdd_dir} (no config files: --no-config)"
        exit 0
    end

    set_env TDD_DIR ${tdd_dir}
    venv_bin = get_env MAKE_VENV_BIN
    exe = get_env MAKE_EXE
    family = os_family
    tdd_bin = set "${tdd_dir}/tdd-venvs/tdd/${venv_bin}"
    rows = exec --fail-on-error "${tdd_bin}/python${exe}" "${MAKE_SCRIPTS}/catalog_rows.py" configs "${tdd_dir}/catalog.json"
    lines = split ${rows.stdout} "\n"
    created = set 0
    kept = set 0
    skipped = set 0
    failed = set 0
    echo "config files in ${tdd_dir}"
    for line in ${lines}
        line = trim ${line}
        if not is_empty ${line}
            words = split ${line} " "
            kind = array_get ${words} 0
            name = array_get ${words} 1
            file = set "${tdd_dir}/${name}.toml"
            exists = is_path_exists ${file}
            keep = set false
            if ${exists}
                keep = not ${force}
            end
            if eq ${kind} launcher
                echo "  ${name}  skipped (a launcher: every argument is the program's)"
                skipped = calc ${skipped} + 1
            elseif ${keep}
                echo "  ${name}  kept     ${file}"
                kept = calc ${kept} + 1
            else
                if eq ${kind} tool
                    out = exec "${tdd_bin}/tdd-exe${exe}" ${name} config --create --force
                elseif eq ${family} windows
                    set_env MAKE_LOADER "${tdd_dir}/tdd-source.ps1"
                    set_env MAKE_COMMAND ${name}
                    out = exec pwsh -NoProfile -Command ". $env:MAKE_LOADER; tdd $env:MAKE_COMMAND config --create --force; exit $LASTEXITCODE"
                else
                    out = exec bash -c ". \"$1/tdd-source.sh\" && tdd \"$2\" config --create --force" _ ${tdd_dir} ${name}
                end
                if eq ${out.code} 0
                    echo "  ${name}  created  ${file}"
                    created = calc ${created} + 1
                else
                    echo "  ${name}  failed"
                    echo ${out.stderr}
                    failed = calc ${failed} + 1
                end
            end
        end
    end

    echo ""
    echo "installed ${tdd_dir}"
    echo "  configs  ${created} created, ${kept} kept, ${skipped} skipped, ${failed} failed"
    echo "  load it  bash, zsh     source ${tdd_dir}/tdd-source.sh"
    echo "           PowerShell    . ${tdd_dir}/tdd-source.ps1"
    if not eq ${failed} 0
        assert_fail "cargo make setup: ${failed} config files could not be created"
    end
    ''']

# --------------------------------------------------------------------- uninstall

# Arguments: --dir PATH (or --dir=PATH); the `--` cargo-make forwards is
# skipped. This deletes a caller-supplied path. catalog.json is the marker tdd
# init writes, so its absence means this is not a tdd dir -- refused rather
# than trusting a mistyped --dir or a stray TDD_DIR. Then it names the line to
# remove from whichever shell profile -- bash, zsh or PowerShell -- loads one of
# the loaders that went with it.
[tasks.uninstall]
description = "Delete the tdd dir and say what to remove from the shell profile"
dependencies = ["make-env"]
script_runner = "@duckscript"
script = [
    '''
    tdd_dir = get_env MAKE_TDD_DIR
    count = array_length ${@}
    i = set 0
    while less_than ${i} ${count}
        arg = array_get ${@} ${i}
        i = calc ${i} + 1
        if eq ${arg} "--dir"
            tdd_dir = array_get ${@} ${i}
            i = calc ${i} + 1
        elseif starts_with ${arg} "--dir="
            tdd_dir = replace ${arg} "--dir=" ""
        elseif not eq ${arg} "--"
            assert_fail "cargo make uninstall: unexpected argument ${arg}"
        end
    end

    if not is_path_exists ${tdd_dir}
        echo "nothing to uninstall: ${tdd_dir} does not exist"
        exit 0
    end
    if not is_path_exists "${tdd_dir}/catalog.json"
        assert_fail "cargo make uninstall: refusing, ${tdd_dir} has no catalog.json so it is not a tdd dir"
    end

    rm -r ${tdd_dir}
    echo "removed ${tdd_dir} (its tool envs and any managed venvs under ${tdd_dir}/managed-venvs)"
    echo ""
    echo "Its loaders are gone with it. If a shell profile loads one, remove that line:"
    echo ""
    echo "    source ${tdd_dir}/tdd-source.sh     (bash, zsh)"
    echo "    . ${tdd_dir}/tdd-source.ps1         (PowerShell)"
    echo ""
    home = get_home_dir
    profiles = array "${home}/.zshrc" "${home}/.bashrc" "${home}/.bash_profile" "${home}/.zprofile" "${home}/.config/powershell/Microsoft.PowerShell_profile.ps1" "${home}/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
    for profile in ${profiles}
        if is_path_exists ${profile}
            text = readfile ${profile}
            if contains ${text} "tdd-source"
                echo "  found in ${profile}"
            end
        end
    end
    echo "The tdd, tdd-exe and tdd-fn functions stay defined in any shell that already"
    echo "loaded them; open a new one."
    ''']

# --------------------------------------------------------------------- cleanup

# The build output and every cache: ruff's, pytest's and Python's -- xp-tool
# included, which holds the suites' function sources, imported when a suite is
# read.
[tasks.clean]
description = "Remove build artifacts and caches"
script_runner = "@duckscript"
script = [
    '''
    rm -r ${WHEELS_OUT}

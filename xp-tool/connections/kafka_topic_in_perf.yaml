# Connection template for: kafka-topic-in (stream-src) — consumer group '<prefix>_perf'
# For the Kafka performance suite (suites/performance/kafka_json.json): kafka_topic_in.yaml
# with librdkafka tuned to read a backlog as fast as the source can.
# fetch.queue.backoff.ms 0: librdkafka stops fetching whenever its local queue holds
# queued.min.messages (100,000) and waits this long before fetching again; a reader that
# drains the queue faster than the wait stalls on every refill (~116,000 against ~495,000
# messages a second with json.loads per message, on one partition).
# Secret values use the 'secret:' prefix, or '$secret:D<n>__<KEY>' to read <KEY> from the collection's backing domain D<n> (see suite.json 'domains').
# A '$secret:' value is resolved on the client when the source/destination is created or updated with this connection.
# '${D<n>__<KEY>}' reads the same bag but interpolates the value PLAIN and inline — for a name rather than a credential.
kind: connectionDef
apiVersion: '1.0'
type: tabsdatak.conn.kafka:KafkaStreamSrcConn
spec:

  # accepts: <value> | secret:<value>
  # the redpanda domain's broker list (meta KAFKA_BROKERS, e.g. localhost:19092)
  #
  servers: '$secret:D0__KAFKA_BROKERS'

  # accepts: <value> | secret:<value>
  # A per-collection group, prefixed by the domain so it is per-run as well.
  #
  group_id: '${D0__DB}_perf'
  # credentials  (optional, default: none) -- OMITTED: the redpanda domain runs without SASL
  # schema_registry  (optional, default: none) -- left off, as in kafka_topic_in.yaml

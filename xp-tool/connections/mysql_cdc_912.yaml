# Connection template for: mysql-cdc (stream-src) — server_id 912
# One of the 91x templates, which differ ONLY in server_id: MySQL admits a single replica
# per server id, and every registered CDC stream publisher attaches its own replica, so
# each concurrently-registered mysql-cdc collection needs a distinct id. The 91x block is
# reserved for performance/mysqlcdc_initial_load (912) and mysqlcdc_changes (913), clear of
# the 51x, 61x, 81x and demo (712) ids, so every mysql-cdc suite can run at the same time.
# Secret values use the 'secret:' prefix, or '$secret:D<n>__<KEY>' to read <KEY> from the collection's backing domain D<n> (see suite.json 'domains').
# A '$secret:' value is resolved on the client when the source/destination is created or updated with this connection.
kind: connectionDef
apiVersion: '1.0'
type: tabsdatak.conn.mysql:MySQLCdcStreamSrcConn
spec:

  # accepts: <value> | secret:<value>
  # replace <value> with the actual uri
  #
  uri: '$secret:D0__URI'
  credentials:
    kind: userPasswordCredentials
    apiVersion: '1.0'
    type: tabsdatak.conn.common.types:UserPassword
    spec:

      # replace <value> with the actual user
      #
      user: '$secret:D0__USER'

      # replace <value> with the actual password
      #
      password: '$secret:D0__PASSWORD'

  # optional (default: 512)
  #
  # xp replaces this with an id of the run and collection (xp conn.mysql_server_id), so a
  # leftover stream from another run cannot hold it; the value here is for using it by hand.
  server_id: 912
  # entity_whitelist  (optional, default: none) -- a list
  # entity_whitelist: []
  # conn_cfg  (optional, default: none) -- a dict (str-keyed)
  # conn_cfg: {}

[project]
name = "tabsdata-dev-tool-pypi"
dynamic = ["version"]
description = "build and publish pypi.tabsdata.com, the static index of Tabsdata's own wheels"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-pypi", "tabsdata-dev-common-core"]

[project.scripts]
pypi = "tabsdata_dev.tool.pypi:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-pypi = { path = "../tabsdata-dev-deps-pypi", editable = true }

[project]
name = "tabsdata-dev-tool-xp-execute"
dynamic = ["version"]
description = "run an xp suite's check script with the tdd module on its path (plumbing of xp's execute stage)"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-xp-execute", "tabsdata-dev-common-core"]

# `_xp-execute`: plumbing (the leading underscore), driven by xp's execute
# stage. Every argument is the script's: SCRIPT ARGS...
[project.scripts]
_xp-execute = "tabsdata_dev.tool.xp_execute:main"

[tool.tdd]
# every argument is the script's, so there are no options to configure
launcher = true

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-xp-execute = { path = "../tabsdata-dev-deps-xp-execute", editable = true }

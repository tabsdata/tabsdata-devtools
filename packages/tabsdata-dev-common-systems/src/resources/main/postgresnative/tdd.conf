# tdd: the settings of a postgresnative system, included from postgresql.conf.
# Written by `tdd system create`; put anything of your own in postgresql.conf.
listen_addresses = '{{ listen_addresses }}'
port = {{ port }}
# Every connection is TCP: a socket in /tmp would live outside the system's
# directory, and one inside it can exceed the length a socket path may have.
unix_socket_directories = ''
{% for key, value in settings.items() -%}
{{ key }} = {{ value }}
{% endfor -%}

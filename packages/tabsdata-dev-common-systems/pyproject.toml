[project]
name = "tabsdata-dev-common-systems"
dynamic = ["version"]
description = "the system / domain command family: descriptors, backends, models, dispatcher"
requires-python = ">=3.11"
# Ranges, not pins: this library is shared by the systems and salesforce
# toolsets, each of which pins these to what its own drivers allow.
dependencies = ["pydantic>=2", "pyyaml>=6", "cryptography>=42"]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.hatch.build.targets.wheel.force-include]
"src/resources/main" = "tabsdata_dev/common/systems/resources"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

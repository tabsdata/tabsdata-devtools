[project]
name = "tabsdata-dev-tool-domain-sf"
dynamic = ["version"]
description = "domain, running in the salesforce toolset (the org's data plane)"
requires-python = ">=3.11"
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-common-systems",
    "tabsdata-dev-deps-salesforce",
]

[project.scripts]
domain-sf = "tabsdata_dev.tool.domain_sf:main"

# Plumbing: `domain` dispatches salesforce data-plane verbs here, into the
# salesforce toolset. Hidden from `tdd help` unless --demo.
[tool.tdd]
hidden = true
[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-common-systems = { path = "../tabsdata-dev-common-systems", editable = true }
tabsdata-dev-deps-salesforce = { path = "../tabsdata-dev-deps-salesforce", editable = true }

[project]
name = "tabsdata-dev-common-core"
dynamic = ["version"]
description = "shared building blocks for every tool: cli, render, proc, parallel"
requires-python = ">=3.11"
# Ranges, not pins: every toolset resolves these independently against its own
# deps-* bundle, and `cargo make gen` warns when the toolsets drift apart.
dependencies = [
    "jinja2>=3.1",
    "rich>=13",
]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

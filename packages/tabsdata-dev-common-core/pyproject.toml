[project]
name = "tabsdata-dev-common-core"
dynamic = ["version"]
description = "shared building blocks for every tool: cli, proc, report, parallel"
requires-python = ">=3.11"
dependencies = ["rich>=13", "pyyaml>=6"]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

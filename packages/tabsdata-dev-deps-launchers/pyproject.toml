# The launchers toolset: `tdk` and `tdkserver` run the real programs inside the
# user's managed venv, so this bundle pins nothing but the test runner. It
# exists because a tool needs a toolset to be dispatched into.
[project]
name = "tabsdata-dev-deps-launchers"
dynamic = ["version"]
description = "pins for the launchers toolset"
requires-python = ">=3.11"
dependencies = ["pytest==8.4.2"]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

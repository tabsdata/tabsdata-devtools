[project]
name = "tabsdata-dev-tool-1p"
dynamic = ["version"]
description = "fetches the crypto key and secrets from 1Password (for tdd env) and pushes items to it"
requires-python = ">=3.11"
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-deps-launchers",
]

# `_1p`: the leading underscore makes it plumbing, left out of `tdd help`
# (listed by `tdd -x`). `tdd env set --crypto/--secrets`, the shell command,
# applies what `fetch` prints -- only a shell can change the shell it runs in;
# `push` files an item `tdd system 1p-template` writes.
[project.scripts]
_1p = "tabsdata_dev.tool.onepassword:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

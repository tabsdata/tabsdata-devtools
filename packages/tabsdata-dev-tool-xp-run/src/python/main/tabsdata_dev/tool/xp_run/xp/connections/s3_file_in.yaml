# Connection template for: s3-file-in (src)
# Secret values use the 'secret:' prefix, or '$secret:D<n>__<KEY>' to read <KEY> from the collection's backing domain D<n> (see suite.json 'domains').
# A '$secret:' value is resolved on the client when the source/destination is created or updated with this connection.
kind: connectionDef
apiVersion: '1.0'
type: tabsdatak.conn.s3:S3SrcConn
spec:

  bucket: '$secret:D0__BUCKET'
  region: '$secret:D0__REGION'
  credentials:
    kind: awsAccessSecretKeyCredentials
    apiVersion: '1.0'
    type: tabsdatak.conn.common.types:AwsAccessSecretKey
    spec:
      access_key_id: '$secret:D0__ACCESS_KEY'
      secret_access_key: '$secret:D0__SECRET_KEY'

  # base path within the bucket (XP data root)
  base_path: '$secret:D0__SYS_PATH'
  # conn_cfg  (optional, default: none) -- a dict (str-keyed)
  # conn_cfg: {}

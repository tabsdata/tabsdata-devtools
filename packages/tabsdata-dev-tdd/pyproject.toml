[project]
name = "tabsdata-dev-tdd"
dynamic = ["version"]
description = "single entry point dispatching to every tabsdata dev tool"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tdd-exe = "tabsdata_dev.tdd.__main__:main"
tdd-install = "tabsdata_dev.tdd.install:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

# The repo-root VERSION rides inside this wheel so a wheels-mode install, which
# has no checkout, still knows what it is. Editable installs read the root file.
[tool.hatch.build.targets.wheel.force-include]
"../../VERSION" = "tabsdata_dev/tdd/VERSION"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

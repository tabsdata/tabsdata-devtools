[project]
name = "tabsdata-dev-tool-system"
dynamic = ["version"]
description = "manage external systems for testing: databases, object stores, services (docker, cloud, remote)"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-systems", "tabsdata-dev-common-core", "tabsdata-dev-common-systems"]

[project.scripts]
system = "tabsdata_dev.tool.system:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-common-systems = { path = "../tabsdata-dev-common-systems", editable = true }
tabsdata-dev-deps-systems = { path = "../tabsdata-dev-deps-systems", editable = true }

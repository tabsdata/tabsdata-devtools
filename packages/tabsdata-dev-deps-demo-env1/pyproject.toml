[project]
name = "tabsdata-dev-deps-demo-env1"
dynamic = ["version"]
description = "pins for the demo-env1 toolset"
requires-python = ">=3.11"
# packaging is pinned differently in demo-env1 and demo-env2 on purpose: the two
# bundles cannot co-resolve, which is the situation toolsets exist for.
dependencies = ["pytest==8.4.2", "packaging==24.0"]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

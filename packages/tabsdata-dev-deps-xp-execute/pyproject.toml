# The xp-execute toolset: the venv an xp suite's check scripts run on, kept
# bare on purpose. A script reaches every tool through `tdd` (the module this
# toolset's tool ships), so it needs none of xp's own pins; one that needs a
# library names it in its execute entry's `requirements` and gets a one-off
# venv of its own, rather than this toolset growing a pin per script.
[project]
name = "tabsdata-dev-deps-xp-execute"
dynamic = ["version"]
description = "pins for the xp-execute toolset: nothing but the test runner"
requires-python = ">=3.11"
dependencies = [
    "pytest==9.1.1",
]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

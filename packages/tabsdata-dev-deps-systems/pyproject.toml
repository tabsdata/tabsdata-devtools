[project]
name = "tabsdata-dev-deps-systems"
dynamic = ["version"]
description = "pins for the systems toolset: SQL dialects and drivers, object-store SDKs, kafka, the frame writer"
requires-python = ">=3.12,<3.13"
# A SQL system needs its SQLAlchemy *dialect*, not just its driver: the dialect
# is what registers the name in Backend.driver (clickhousedb <- clickhouse-connect,
# snowflake <- snowflake-sqlalchemy, databricks <- databricks-sqlalchemy).
# ibm_db builds against the IBM clidriver its install downloads -- natively on arm64 too.
dependencies = [
    "azure-storage-blob==12.31.0",
    "boto3==1.43.115",
    "clickhouse-connect==1.11.0",
    "confluent-kafka==2.16.0",
    "cryptography==50.0.2",
    "databricks-sqlalchemy==2.0.10",
    "fastavro==1.13.1",
    "google-cloud-bigquery==3.46.2",
    "google-cloud-storage==3.17.1",
    "ibm_db==3.3.0",
    "ibm_db_sa==0.4.4",
    "mysql-connector-python==26.7.0",
    "oracledb==26.0.1",
    "pandas==3.0.6",
    "polars==2.0.0",
    "protobuf==7.36.2",
    "psycopg2-binary==2.9.13",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pymongo==4.19.0",
    "pyodbc==5.3.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "snowflake-sqlalchemy==1.11.1",
    "sqlalchemy==2.0.55",
    "sqlparse==0.6.0",
]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

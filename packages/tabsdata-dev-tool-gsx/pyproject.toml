[project]
name = "tabsdata-dev-tool-gsx"
dynamic = ["version"]
description = "GitHub issues + `gh stack`: an issue, a stack branch and a PR in one command"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-launchers", "tabsdata-dev-common-core"]

[project.scripts]
gsx = "tabsdata_dev.tool.gsx:main"

# Commented out: the generator treats a disabled tool as if the package were
# not there -- no catalog entry, no toolset membership, no env, no config file.
# The code and its tests stay put; drop the marker and `cargo make gen` brings
# the tool back (the alias in tddsrc.sh is commented out beside it).
[tool.tdd]
disabled = true

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.hatch.build.targets.wheel.force-include]
"src/resources/main" = "tabsdata_dev/tool/gsx/resources"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

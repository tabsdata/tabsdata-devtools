[project]
name = "tabsdata-dev-deps-salesforce"
dynamic = ["version"]
description = "pins for the salesforce toolset: the org's data plane (cumulusci-plus, snowfakery)"
requires-python = ">=3.12,<3.13"
# Kept apart from the systems toolset because cumulusci-plus pins sqlalchemy<2,
# which that toolset's dialects contradict (databricks-sqlalchemy needs >=2.0.21).
# simple-salesforce is a direct import of the loader, so it is pinned here rather
# than left to arrive transitively through cumulusci-plus.
dependencies = [
    "cryptography==50.0.2",
    "cumulusci-plus==5.7.0",
    "docutils==0.21.2",
    "keyring==23.0.1",
    "pydantic==2.14.2",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "simple-salesforce==1.12.9",
    "snowfakery==4.2.1",
    "sqlalchemy==1.4.54",
]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

# The twine toolset: twine and nothing else. Its own rather than `pypi`'s:
# twine 7 needs packaging>=26.1 and brings requests, rich and keyring, none of
# which the index builder should share a resolution with.
[project]
name = "tabsdata-dev-deps-twine"
dynamic = ["version"]
description = "pins for the twine toolset: twine, for uploading to a package index"
requires-python = ">=3.11"
dependencies = [
    "pytest==9.2.0",
    "twine==7.0.0",
]

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

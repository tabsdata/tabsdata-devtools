[project]
name = "tabsdata-dev-tool-smoke"
dynamic = ["version"]
description = "the end-to-end smoke test scripts: export them somewhere to run them"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-launchers", "tabsdata-dev-common-core"]

[project.scripts]
smoke = "tabsdata_dev.tool.smoke:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

# The scripts live at the repo root, where they are edited and run, and are
# copied in when a wheel is built. An editable install copies nothing -- a link
# has no build step to hook -- so there the tool reads them where they are; see
# `_root()`. Same arrangement as the shell package's assets.
[tool.hatch.build.targets.wheel.force-include]
"../../smoke-tool" = "tabsdata_dev/tool/smoke/scripts"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

[project]
name = "tabsdata-dev-tool-smoke"
dynamic = ["version"]
description = "the end-to-end smoke test scripts: run one, or export them to read and edit"
requires-python = ">=3.11"
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-deps-launchers",
]

# `_smoke`: the Python half of the scripts' shared engine -- what both
# families of it would otherwise write twice. The leading underscore makes it
# plumbing, left out of `tdd help` (listed by `tdd -x`).
[project.scripts]
_smoke = "tabsdata_dev.tool.smoke.engine:main"
smoke = "tabsdata_dev.tool.smoke:main"

[tool.tdd.summaries]
_smoke = "plumbing of the smoke scripts: the config edits and the parsing both shell families of their engine share"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

# The scripts live at the repo root, where they are edited and run, and are
# copied in when a wheel is built. An editable install copies nothing -- a link
# has no build step to hook -- so there the tool reads them where they are; see
# `_root()`. Same arrangement as the shell package's assets.
[tool.hatch.build.targets.wheel.force-include]
"../../smoke-tool" = "tabsdata_dev/tool/smoke/scripts"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

[project]
name = "tabsdata-dev-tool-demo-exe1"
dynamic = ["version"]
description = "demo tool in the demo-env1 toolset: prints its name"
requires-python = ">=3.11"
# Echoing a name needs no common-*; it is declared anyway because this is the
# canonical tool shape (one deps-* plus the commons), and because common-* only
# reaches an editable toolset env through a tool that depends on it.
dependencies = ["tabsdata-dev-deps-demo-env1", "tabsdata-dev-common-core"]

[project.scripts]
demo-exe1 = "tabsdata_dev.tool.demo_exe1:main"

# Kept out of `tdd help` unless asked for with --demo: these exist to show the
# shape of a tool and to exercise the machinery, not to be used.
[tool.tdd]
demo = true

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-demo-env1 = { path = "../tabsdata-dev-deps-demo-env1", editable = true }

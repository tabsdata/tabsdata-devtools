[project]
name = "tabsdata-dev-tool-venv"
dynamic = ["version"]
description = "plumbing of tdd venv: create, delete, list and describe managed venvs (no activation)"
requires-python = ">=3.11"
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-deps-launchers",
]

# `_venv`: the leading underscore makes it plumbing, left out of `tdd help`
# (listed by `tdd -x`). `tdd venv`, the shell command, drives it for all but
# entering and leaving a venv, which only a shell can do; xp drives it for the
# one-off venvs of its execute stages.
[project.scripts]
_venv = "tabsdata_dev.tool.venv:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

[project]
name = "tabsdata-dev-tool-domain"
dynamic = ["version"]
description = "manage domains inside systems: schemas, generated data, change sets"
requires-python = ">=3.11"
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-common-systems",
    "tabsdata-dev-deps-systems",
]

[project.scripts]
domain = "tabsdata_dev.tool.domain:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-common-systems = { path = "../tabsdata-dev-common-systems", editable = true }
tabsdata-dev-deps-systems = { path = "../tabsdata-dev-deps-systems", editable = true }

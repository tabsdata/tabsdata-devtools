[project]
name = "tabsdata-dev-tool-xp"
dynamic = ["version"]
description = "run tabsdata example suites: instances, domains, projects, triggers, one-shot and bench"
requires-python = ">=3.11"
# Its own toolset: `domain` and tdk are reached through `tdd`, never imported, so
# xp shares no resolution with them (deps-xp says why that matters).
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-deps-xp",
]

[project.scripts]
xp = "tabsdata_dev.tool.xp:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

# The suites and connection templates live at the repo root, where they are read
# and edited, and are copied in when a wheel is built. An editable install copies
# nothing -- a link has no build step to hook -- so there the tool reads them
# where they are; see `suites.builtin_root()`. Same arrangement as the smoke
# scripts and the shell package's assets.
[tool.hatch.build.targets.wheel.force-include]
"../../xp-tool" = "tabsdata_dev/tool/xp/xp-tool"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-xp = { path = "../tabsdata-dev-deps-xp", editable = true }

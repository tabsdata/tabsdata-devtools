[project]
name = "tabsdata-dev-tool-xp"
dynamic = ["version"]
description = "run tabsdata example suites: instances, domains, projects, triggers, one-shot and bench"
requires-python = ">=3.11"
# pydantic + pyyaml come from the systems bundle, whose toolset also holds the
# `domain` tool this one drives; tdk is reached through `tdd tdk`, never imported.
dependencies = ["tabsdata-dev-deps-systems", "tabsdata-dev-common-core"]

[project.scripts]
xp = "tabsdata_dev.tool.xp:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-systems = { path = "../tabsdata-dev-deps-systems", editable = true }

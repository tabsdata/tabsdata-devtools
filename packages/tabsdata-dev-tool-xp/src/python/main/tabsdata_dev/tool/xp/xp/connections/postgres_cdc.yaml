# Connection template for: postgres-cdc (stream-src)
# Secret values use the 'secret:' prefix, or '$secret:D<n>__<KEY>' to read <KEY> from the collection's backing domain D<n> (see suite.json 'domains').
# A '$secret:' value is resolved on the client when the source/destination is created or updated with this connection.
kind: connectionDef
apiVersion: '1.0'
type: tabsdatak.conn.postgres:PostgresCdcStreamSrcConn
spec:

  # accepts: <value> | secret:<value>
  # replace <value> with the actual uri
  #
  # A postgres domain names both networks its instance answers on, so there is no
  # unqualified URI to read: this is the address the FUNCTION uses, and a function
  # runs inside the instance -- in the cluster for a k8s provider, where only the
  # private plane routes. The `postgres` / `postgrescdc` containers the suites
  # ship with record one address under both names, so the choice costs them
  # nothing; repoint a domain at a managed instance served by a local (kminus)
  # tdkserver and it is D0__EXTERNAL_URI you want instead. Credentials-free by
  # design -- user and password ride below.
  #
  uri: '$secret:D0__INTERNAL_URI'
  credentials:
    kind: userPasswordCredentials
    apiVersion: '1.0'
    type: tabsdatak.conn.common.types:UserPassword
    spec:

      # replace <value> with the actual user
      #
      user: '$secret:D0__USER'

      # replace <value> with the actual password
      #
      password: '$secret:D0__PASSWORD'
  # entity_whitelist  (optional, default: none) -- a list
  # entity_whitelist: []
  # conn_cfg  (optional, default: none) -- a dict (str-keyed)
  # conn_cfg: {}

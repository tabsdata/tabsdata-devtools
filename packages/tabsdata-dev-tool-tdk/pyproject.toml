[project]
name = "tabsdata-dev-tool-tdk"
dynamic = ["version"]
description = "run tabsdata's tdk CLI inside the venv last activated (managed by tdd venv or not)"
requires-python = ">=3.11"
dependencies = [
    "tabsdata-dev-common-core",
    "tabsdata-dev-deps-launchers",
]

[project.scripts]
tdk = "tabsdata_dev.tool.tdk:main"

[tool.tdd]
# every argument is the program's, so there are no options to configure
launcher = true

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

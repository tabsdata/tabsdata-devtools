[project]
name = "tabsdata-dev-tool-pqt"
dynamic = ["version"]
description = "run parquet-tools (show, csv, inspect a parquet file) from the xp toolset"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-xp", "tabsdata-dev-common-core"]

[project.scripts]
pqt = "tabsdata_dev.tool.pqt:main"

[tool.tdd]
# every argument is the program's, so there are no options to configure
launcher = true

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-xp = { path = "../tabsdata-dev-deps-xp", editable = true }

[project]
name = "tabsdata-dev-tool-pycache"
dynamic = ["version"]
description = "clean the uv and pip caches, by package prefix (default tabsdata) or all of it"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-launchers", "tabsdata-dev-common-core"]

[project.scripts]
pycache = "tabsdata_dev.tool.pycache:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }

[project]
name = "tabsdata-dev-tool-apidoc"
dynamic = ["version"]
description = "generates a Python package's API as JSON, for documentation generation"
requires-python = ">=3.11"
dependencies = ["tabsdata-dev-deps-launchers", "tabsdata-dev-common-core"]

[project.scripts]
apidoc = "tabsdata_dev.tool.apidoc:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = '^(?P<version>\S+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/python/main/tabsdata_dev"]
sources = ["src/python/main"]

[tool.hatch.build.targets.wheel.force-include]
"src/resources/main" = "tabsdata_dev/tool/apidoc/resources"

[tool.pytest.ini_options]
testpaths = ["src/python/test"]

[tool.uv.sources]
tabsdata-dev-common-core = { path = "../tabsdata-dev-common-core", editable = true }
tabsdata-dev-deps-launchers = { path = "../tabsdata-dev-deps-launchers", editable = true }
